# Gradle Build Speed & Performance Optimizations
# JVM & Memory Settings (G1GC + 4GB heap to eliminate GC pauses during compilation)
org.gradle.jvmargs=-Xmx4096M -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2048M"
kotlin.daemon.jvmargs=-Xmx2048M -XX:+UseG1GC

# Parallel Execution, Caching & File System Watching (Critical for Windows IO speed)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin Incremental Compilation & Classpath Snapshotting
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.build.report.output=file
kotlin.code.style=official

# KSP (Kotlin Symbol Processing) Incremental Processing
ksp.incremental=true
ksp.incremental.intermodule=true

# Android Gradle Plugin & R8 Optimizations
android.enableR8.fullMode=true
com.android.tools.r8.maxNumberOfThreads=8
android.dependency.useConstraints=true
android.disallowKotlinSourceSets=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.nonTransitiveRClass=true
android.r8.strictFullModeForKeepRules=false
android.uniquePackageNames=false
android.useAndroidX=true
