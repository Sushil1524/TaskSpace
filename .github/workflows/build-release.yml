name: Android Release

on:
  workflow_dispatch:
  push:
    # branches:
    #   - main
    tags:
      - 'v*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease -PBACKUP_SECRET_KEY="${{ secrets.BACKUP_SECRET_KEY }}"
      
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner sign \
            -ks release-key.jks \
            -ks-key-alias ${{ secrets.KEY_ALIAS }} \
            -ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            -key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/TaskSpace-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --verbose \
            app/build/outputs/apk/release/TaskSpace-release.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskSpace-release
          path: app/build/outputs/apk/release/TaskSpace-release.apk
          retention-days: 30

      # - name: Create GitHub Release
      #   if: startsWith(github.ref, 'refs/tags/')
