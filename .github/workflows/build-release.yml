name: Android Release

on:
  workflow_dispatch:
  push:
    # branches:
    #   - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          ./gradlew assembleRelease \
            -PBACKUP_SECRET_KEY="$BACKUP_SECRET_KEY" \
            -Pkotlin.incremental=false

      - name: Prepare & Verify Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_DIR="app/build/outputs/apk/release"
          if [ -f "$BUILD_DIR/app-release.apk" ]; then
            echo "Gradle-signed APK found."
            cp "$BUILD_DIR/app-release.apk" "$BUILD_DIR/TaskSpace-release.apk"
          elif [ -f "$BUILD_DIR/app-release-unsigned.apk" ]; then
            echo "Unsigned APK found. Signing with apksigner..."
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner sign \
              -ks release-key.jks \
              -ks-key-alias "$KEY_ALIAS" \
              -ks-pass pass:"$STORE_PASSWORD" \
              -key-pass pass:"$KEY_PASSWORD" \
              --out "$BUILD_DIR/TaskSpace-release.apk" \
              "$BUILD_DIR/app-release-unsigned.apk"
          else
            echo "Error: No APK found in $BUILD_DIR"
            exit 1
          fi

          # Verify signature
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)/apksigner verify --verbose \
            "$BUILD_DIR/TaskSpace-release.apk"

      - name: Clean up Keystore
        if: always()
        run: rm -f release-key.jks

      - name: Upload Release Artifacts (APK & ProGuard Mapping)
        uses: actions/upload-artifact@v4
        with:
          name: TaskSpace-release
          path: |
            app/build/outputs/apk/release/TaskSpace-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 7

      # - name: Create GitHub Release
      #   if: startsWith(github.ref, 'refs/tags/')
